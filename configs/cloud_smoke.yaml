version: cloud_smoke
enabled_subtypes:
  - cat
  - cnt
  - col
  - rel
pair_limits:
  per_subtype: 512
input_paths:
  shell_bank: data/outputs/shell_bank_v1.json
  cat_neg_bank: data/outputs/cat_neg_bank_v2.json
  fact_index: data/outputs/fact_index_v0.jsonl
  atomic_facts: data/outputs/atomic_facts_v0.jsonl
output_paths:
  pairs_unbalanced: data/outputs/pairs_unbalanced_v0.jsonl
  pairs_balanced: data/outputs/pairs_balanced_v0.jsonl
  pair_stats: data/outputs/pair_stats_v0.json
output_path: data/outputs/pairs_balanced_v0.jsonl
targets:
  cat: 32
  cnt: 32
  col: 16
  rel: 32
caps:
  per_label_cap: 8
  per_rel_pattern_cap: 8
sampling:
  max_cat_anchors_per_image: 2
  max_cnt_anchors_per_image: 2
  max_col_anchors_per_image: 2
  max_rel_pairs_per_image: 2
coco:
  instances_json: data/mock/mock_coco_instances.json
  panoptic_json: data/mock/mock_coco_panoptic.json
  panoptic_root: data/mock/panoptic
  image_root: data/mock/images
  use_panoptic: true
  use_images_for_color: true
  thing_only: true
  max_images: 5
  sample_images_randomly: false
  random_seed: 42
run:
  log_every: 20
  save_every: 100
  resume: false
filters:
  object_min_area_ratio: 0.01
  rel_min_abs_dx: 0.75
  rel_max_abs_dy: 1.0
  rel_max_iou: 0.1
