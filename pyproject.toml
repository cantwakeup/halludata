[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lvlm-fact-pair-bank"
version = "0.1.0"
description = "Mock pipeline for LVLM hallucination fact-counterfact pair generation."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
image = [
    "Pillow>=10.0",
]
llava = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.29",
    "Pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
